[workspace]
members = ["crates/wsus-protocol"]
exclude = ["fuzz", "crates"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/CaddyGlow/wsus-rs"

[workspace.dependencies]
serde_json = "1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
strip = true
