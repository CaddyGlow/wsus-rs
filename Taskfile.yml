version: '3'
tasks:
  build:
    cmds: ["cargo build --package wsus-cli --release --locked"]
  run:
    cmds: ["cargo run --package wsus-cli --locked -- {{.CLI_ARGS}}"]
  check:
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - cargo test --workspace --all-features --locked
  build:windows:
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    cmds:
      - cargo xwin build --package wsus-cli --release --locked --target x86_64-pc-windows-msvc {{.CLI_ARGS}}
      - mkdir -p dist
      - cp target/x86_64-pc-windows-msvc/release/wsus.exe dist/wsus.exe
  fuzz:check:
    cmds:
      - cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - cargo test --manifest-path fuzz/Cargo.toml --locked
  fuzz:seed:
    cmds: ["python3 fuzz/seed_wsus.py"]
  fuzz:
    dir: fuzz
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/target/honggfuzz-gcc'
      HFUZZ_WORKSPACE: '{{.ROOT_DIR}}/target/hfuzz_workspace'
      HFUZZ_INPUT: '{{.ROOT_DIR}}/fuzz/corpus/{{.CLI_ARGS}}'
      HFUZZ_BUILD_ARGS: '--locked'
      RUSTC_WRAPPER: ''
      CARGO_INCREMENTAL: '0'
      CC: 'gcc'
    cmds:
      - NIX_HARDENING_ENABLE= cargo hfuzz run {{.CLI_ARGS}}
